<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ad Proteum">
<meta name="theme-color" content="#0f0f12">
<title>Ad Proteum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0f0f12; }
  :root {
    --bg: #0f0f12; --card: #17171c; --line: #26262e;
    --text: #e8e8ec; --dim: #8b8b98; --blue: #3b82f6; --brick: #b84040;
  }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--text); min-height: 100vh;
    padding: max(16px, env(safe-area-inset-top)) 15px calc(40px + env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto; -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button { font-family: inherit; cursor: pointer; border: none; }
  input { font-family: inherit; }

  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 9px; }
  .logo { width: 38px; height: 38px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 9px; display: grid; place-items: center;
    font-family: Georgia, serif; font-style: italic; font-size: 16px; color: var(--blue); }
  .brand h1 { margin: 0; font-family: Georgia, serif; font-style: italic; font-size: 16px; font-weight: 400; }
  .brand h1 span { color: var(--blue); }
  .brand p { margin: 2px 0 0; font-size: 8.5px; letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
  .who { display: flex; gap: 3px; background: var(--card); padding: 3px; border-radius: 8px; border: 1px solid var(--line); }
  .who button { background: transparent; color: var(--dim); font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 6px; }
  .who button[aria-pressed="true"] { background: var(--blue); color: #fff; }

  .scale { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 16px; margin-bottom: 16px; }
  .readout { display: flex; align-items: baseline; gap: 7px; }
  .grams { font-family: Georgia, serif; font-style: italic; font-size: 54px; line-height: .9;
    letter-spacing: -.02em; font-variant-numeric: tabular-nums; transition: color .3s; }
  .of-goal { font-size: 14px; color: var(--dim); }
  .of-goal b { color: var(--text); font-weight: 600; }
  .bar { margin-top: 16px; height: 8px; background: var(--bg); border-radius: 4px; position: relative; overflow: hidden; }
  .bar i { position: absolute; inset: 0 auto 0 0; background: var(--blue); border-radius: 4px; width: 0;
    transition: width .4s cubic-bezier(.2,.7,.3,1); }
  .status { margin-top: 13px; font-size: 12.5px; color: var(--dim); line-height: 1.45; }
  .status b { color: var(--blue); font-weight: 600; }

  .week { display: grid; grid-template-columns: repeat(7,1fr); gap: 5px; margin-bottom: 10px; }
  .day { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 3px 7px; text-align: center; }
  .day.today { border-color: var(--blue); }
  .day .d { font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
  .day .v { font-family: Georgia, serif; font-style: italic; font-size: 15px; margin-top: 3px; }
  .day .track { height: 3px; background: var(--bg); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .day .track i { display: block; height: 100%; background: var(--blue); border-radius: 2px; }
  .day.hit .v { color: var(--blue); }
  .day.miss .v { color: var(--brick); }
  .day { width: 100%; color: inherit; }
  .day.sel { border-color: var(--blue); box-shadow: 0 0 0 1.5px var(--blue); }
  .day.fut { opacity: .4; }
  .day:not(.fut):active { transform: scale(.96); }
  .avg { font-size: 12px; color: var(--dim); margin: 0 0 20px; }
  .avg b { color: var(--text); font-weight: 600; }

  .eyebrow { font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); font-weight: 600; margin: 0 0 9px; }
  .group { margin-bottom: 20px; }

  .cats { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 9px; margin-bottom: 10px; scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  .cats button { background: none; color: var(--dim); font-size: 12px; font-weight: 600; padding: 4px 0;
    white-space: nowrap; border-bottom: 2px solid transparent; }
  .cats button[aria-pressed="true"] { color: var(--text); border-bottom-color: var(--blue); }
  .foods { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .food { background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 10px 11px;
    text-align: left; color: var(--text); display: flex; justify-content: space-between; align-items: center;
    gap: 8px; transition: transform .1s, border-color .15s; }
  .food:active { transform: scale(.97); border-color: var(--blue); }
  .food .nm { font-size: 12.5px; font-weight: 500; line-height: 1.25; }
  .food .nm small { display: block; color: var(--dim); font-size: 10.5px; font-weight: 400; margin-top: 2px; }
  .food .g { font-family: Georgia, serif; font-style: italic; font-size: 15px; color: var(--blue); }

  .custom { display: flex; gap: 6px; }
  .custom input { background: var(--card); border: 1px solid var(--line); border-radius: 9px; color: var(--text);
    padding: 11px 12px; font-size: 16px; width: 100%; }
  .custom input:focus { outline: 2px solid var(--blue); outline-offset: -1px; }
  .custom input.n { width: 90px; flex: none; }
  .custom button { background: var(--blue); color: #fff; border-radius: 9px; padding: 0 15px; font-weight: 600; font-size: 14px; }

  .log-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .log-row .nm { flex: 1; }
  .log-row .g { font-family: Georgia, serif; font-style: italic; font-size: 15px; }
  .log-row .x { background: none; color: var(--dim); font-size: 20px; padding: 0 4px; line-height: 1; }
  .empty { color: var(--dim); font-size: 13px; line-height: 1.5; padding: 2px 0 6px; }

  .goal-edit { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--dim); }
  .goal-edit input { background: var(--card); border: 1px solid var(--line); border-radius: 7px; color: var(--text);
    padding: 7px 9px; width: 80px; font-family: Georgia, serif; font-style: italic; font-size: 16px; }
  .foot { margin-top: 24px; font-size: 11px; color: var(--dim); line-height: 1.55; border-top: 1px solid var(--line); padding-top: 13px; }
  .offline { background: #2a1a1a; border: 1px solid var(--brick); color: #e8b0b0; font-size: 12px;
    padding: 9px 12px; border-radius: 8px; margin-bottom: 14px; display: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="top">
  <div class="brand">
    <div class="logo">VL</div>
    <div>
      <h1>Ad <span>Proteum</span></h1>
      <p>Measure · Adapt · Become</p>
    </div>
  </div>
  <div class="who" id="who"></div>
</div>

<div class="offline" id="offline">Sin conexión con el servidor. Los cambios no se están guardando.</div>

<div class="scale">
  <div class="readout">
    <span class="grams" id="grams">0</span>
    <span class="of-goal">g de <b id="goalTxt">160</b></span>
  </div>
  <div class="bar"><i id="fill"></i></div>
  <div class="status" id="status">Cargando…</div>
</div>

<p class="eyebrow">Esta semana</p>
<div class="week" id="week"></div>
<p class="avg" id="avg"></p>

<div class="group">
  <p class="eyebrow">Sumar comida</p>
  <div class="cats" id="cats"></div>
  <div class="foods" id="foods"></div>
</div>

<div class="group">
  <p class="eyebrow">Otra cosa</p>
  <div class="custom">
    <input id="cName" placeholder="Qué comiste" autocomplete="off">
    <input id="cGrams" class="n" placeholder="g prot" inputmode="numeric">
    <button id="cAdd">Sumar</button>
  </div>
</div>

<div class="group">
  <p class="eyebrow" id="logLabel">Hoy</p>
  <div id="log"></div>
</div>

<div class="group">
  <p class="eyebrow">Objetivo diario</p>
  <div class="goal-edit"><input id="goalInput" inputmode="numeric"> <span>gramos por día</span></div>
</div>

<p class="foot" id="foot"></p>

<script>
const SUPABASE_URL = 'https://pybkzlslfbwoktyvcwhk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_obpv0u23Rf4O-EChOmOg3w_jT7-C3Lf';

const H = {
  'apikey': SUPABASE_KEY,
  'Authorization': 'Bearer ' + SUPABASE_KEY,
  'Content-Type': 'application/json'
};

async function api(path, opts = {}) {
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + path, { ...opts, headers: { ...H, ...(opts.headers||{}) } });
  if (!r.ok) throw new Error(await r.text());
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

const DB = {
  "Carnes": [
    ["Pechuga de pollo","100 g",25],["Pata muslo de pollo","1 pata muslo",22],
    ["Carne vacuna","100 g",20],["Carne de cerdo","100 g",20],
    ["Carne picada","100 g",19],["Milanesa","1 unidad",13],
    ["Jamón crudo","50 g",12],["Jamón cocido","50 g",9]
  ],
  "Huevo y lácteos": [
    ["Huevo","1 unidad",6],["Claras","3 unidades",11],
    ["Yogur","200 g",12],["Leche","250 ml",8],["Ricota","100 g",11],
    ["Queso en fetas","1 feta (20 g)",5],["Queso duro / rallado","20 g",7],
    ["Queso cremoso","20 g",4]
  ],
  "Pescado": [
    ["Atún","100 g",24],["Merluza","100 g",19],["Salmón","100 g",20],
    ["Caballa","100 g",20],["Sardinas","100 g",24]
  ],
  "Legumbres y granos": [
    ["Lentejas cocidas","200 g",17],["Garbanzos cocidos","200 g",16],["Porotos cocidos","200 g",15],
    ["Avena","60 g",8],["Quinoa cocida","150 g",6],
    ["Frutos secos","30 g",6],["Mantequilla de maní","30 g",7],["Chía","30 g",5],
    ["Arroz cocido","200 g",5],["Pan masa madre","1 rodaja",4]
  ],
  "Suplementos": [
    ["Proteína en polvo","1 medida",24],["Barra proteica","1 unidad",15]
  ]
};

const PERSONAS = ["Gastón", "Irena"];
const DEFAULT_GOALS = { "Gastón": 160, "Irena": 110, "Verónica": 90 };

// Portal individual: ?solo=Nombre fija la persona y esconde el selector.
const SOLO = new URLSearchParams(location.search).get('solo');

const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const hoy = () => iso(new Date());
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDias = (fechaStr, n) => { const d = parseISO(fechaStr); d.setDate(d.getDate()+n); return iso(d); };
function lunesDe(fechaStr){
  const d = parseISO(fechaStr); const dia = d.getDay();
  d.setDate(d.getDate() - (dia === 0 ? 6 : dia - 1)); return d;
}
function etiquetaDia(fechaStr){
  if (fechaStr === hoy()) return 'Hoy';
  if (fechaStr === addDias(hoy(), -1)) return 'Ayer';
  return parseISO(fechaStr).toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short'});
}

let who = SOLO || "Gastón", cat = "Carnes", entries = [], goals = {}, semana = [];
let fechaActiva = hoy(), lunesVista = lunesDe(hoy());
const $ = id => document.getElementById(id);
const flagOffline = on => $('offline').style.display = on ? 'block' : 'none';

async function cargarObjetivos(){
  try {
    const rows = await api('proteina_objetivos?select=persona,objetivo');
    goals = {}; rows.forEach(r => goals[r.persona] = r.objetivo);
    Object.keys(DEFAULT_GOALS).forEach(p => { if (!goals[p]) goals[p] = DEFAULT_GOALS[p]; });
    flagOffline(false);
  } catch(e) { goals = { ...DEFAULT_GOALS }; flagOffline(true); }
}

async function guardarObjetivo(persona, valor){
  try {
    await api('proteina_objetivos', {
      method: 'POST',
      headers: { 'Prefer': 'resolution=merge-duplicates' },
      body: JSON.stringify({ persona, objetivo: valor })
    });
    flagOffline(false);
  } catch(e) { flagOffline(true); }
}

async function cargarDia(){
  try {
    entries = await api(`proteina_registros?select=id,alimento,gramos&persona=eq.${encodeURIComponent(who)}&fecha=eq.${fechaActiva}&order=creado_en.asc`);
    flagOffline(false);
  } catch(e) { entries = []; flagOffline(true); }
}

async function cargarSemana(){
  const lunes = new Date(lunesVista);
  const domingo = new Date(lunes); domingo.setDate(domingo.getDate() + 6);
  let rows = [];
  try {
    rows = await api(`proteina_registros?select=fecha,gramos&persona=eq.${encodeURIComponent(who)}&fecha=gte.${iso(lunes)}&fecha=lte.${iso(domingo)}`);
    flagOffline(false);
  } catch(e) { flagOffline(true); }
  const acum = {};
  rows.forEach(r => { acum[r.fecha] = (acum[r.fecha]||0) + r.gramos; });
  semana = [];
  for (let i=0; i<7; i++){
    const d = new Date(lunes); d.setDate(d.getDate()+i);
    semana.push({ fecha: iso(d), dia: d.getDay(), total: acum[iso(d)] || 0, futuro: iso(d) > hoy() });
  }
}

const total = () => entries.reduce((s,e)=>s+e.gramos,0);

function pintarQuien(){
  if (SOLO) { $('who').style.display = 'none'; return; }
  $('who').innerHTML = PERSONAS.map(n => `<button data-who="${n}" aria-pressed="${n===who}">${n}</button>`).join('');
}
function pintarCats(){
  $('cats').innerHTML = Object.keys(DB).map(c => `<button data-cat="${c}" aria-pressed="${c===cat}">${c}</button>`).join('');
}
function pintarFoods(){
  $('foods').innerHTML = DB[cat].map(([n,p,g],i) =>
    `<button class="food" data-food="${i}"><span class="nm">${n}<small>${p}</small></span><span class="g">${g}</span></button>`).join('');
}
function pintarEscala(){
  const t = total(), goal = goals[who] || 160;
  $('grams').textContent = t;
  $('goalTxt').textContent = goal;
  $('fill').style.width = Math.min(100,(t/goal)*100) + '%';
  $('grams').style.color = t >= goal ? 'var(--blue)' : 'var(--text)';
  const falta = goal - t;
  const esHoy = fechaActiva === hoy();
  $('status').innerHTML = t === 0 ? (esHoy ? 'Todavía no anotaste nada hoy.' : 'No hay nada registrado este día.')
    : falta > 0 ? `Te faltan <b>${falta} g</b>.`
    : `Objetivo cumplido. <b>${Math.abs(falta)} g</b> por encima.`;
}
function pintarSemana(){
  const goal = goals[who] || 160;
  const L = ['D','L','M','M','J','V','S'];
  $('week').innerHTML = semana.map(s => {
    const esActivo = s.fecha === fechaActiva;
    const esHoy = s.fecha === hoy();
    const v = esActivo ? total() : s.total;
    let cls = s.futuro ? 'fut' : (v >= goal ? 'hit' : (v > 0 ? 'miss' : ''));
    if (esHoy) cls += ' today';
    if (esActivo) cls += ' sel';
    return `<button class="day ${cls}" data-fecha="${s.fecha}" ${s.futuro ? 'disabled' : ''}>
      <div class="d">${L[s.dia]}</div>
      <div class="v">${s.futuro ? '·' : v}</div>
      <div class="track"><i style="width:${s.futuro ? 0 : Math.min(100,(v/goal)*100)}%"></i></div></button>`;
  }).join('');
  const vals = semana.filter(s => !s.futuro).map(s => s.fecha === fechaActiva ? total() : s.total);
  const hechos = vals.filter(v => v > 0);
  const prom = hechos.length ? Math.round(hechos.reduce((a,b)=>a+b,0)/hechos.length) : 0;
  const cumplidos = vals.filter(v => v >= goal).length;
  $('avg').innerHTML = hechos.length
    ? `Promedio <b>${prom} g</b> · objetivo cumplido <b>${cumplidos} de ${vals.length}</b> días`
    : 'Sin registros esta semana todavía.';
}
function pintarLog(){
  $('logLabel').textContent = etiquetaDia(fechaActiva);
  $('log').innerHTML = entries.length === 0
    ? `<p class="empty">Tocá una comida arriba para empezar. Se guarda solo y arranca de cero cada día.</p>`
    : entries.map(e => `<div class="log-row"><span class="nm">${e.alimento}</span><span class="g">${e.gramos}</span>
        <button class="x" data-del="${e.id}" aria-label="Borrar">×</button></div>`).join('');
}
function pintarTodo(){ pintarEscala(); pintarSemana(); pintarLog(); }

async function cambiarDia(nuevaFecha){
  if (nuevaFecha > hoy()) return;
  fechaActiva = nuevaFecha;
  lunesVista = lunesDe(fechaActiva);
  await cargarDia(); await cargarSemana(); pintarTodo();
}

async function sumar(alimento, gramos){
  if (!alimento || !gramos || gramos <= 0) return;
  const fila = { persona: who, fecha: fechaActiva, alimento, gramos: Math.round(gramos) };
  try {
    const res = await api('proteina_registros', {
      method: 'POST', headers: { 'Prefer': 'return=representation' }, body: JSON.stringify(fila)
    });
    entries.push(res[0]); pintarTodo(); flagOffline(false);
  } catch(e) { flagOffline(true); }
}

$('who').onclick = async e => {
  const b = e.target.closest('[data-who]'); if(!b) return;
  who = b.dataset.who; pintarQuien();
  fechaActiva = hoy(); lunesVista = lunesDe(hoy());
  $('goalInput').value = goals[who];
  await cargarDia(); await cargarSemana(); pintarTodo();
};
$('week').onclick = e => { const b = e.target.closest('[data-fecha]'); if(!b) return; cambiarDia(b.dataset.fecha); };
$('cats').onclick = e => { const b = e.target.closest('[data-cat]'); if(!b) return; cat = b.dataset.cat; pintarCats(); pintarFoods(); };
$('foods').onclick = e => { const b = e.target.closest('[data-food]'); if(!b) return; const [n,p,g] = DB[cat][+b.dataset.food]; sumar(`${n} · ${p}`, g); };
$('log').onclick = async e => {
  const b = e.target.closest('[data-del]'); if(!b) return;
  const id = b.dataset.del;
  try {
    await api('proteina_registros?id=eq.' + id, { method: 'DELETE' });
    entries = entries.filter(x => x.id !== id); pintarTodo(); flagOffline(false);
  } catch(err) { flagOffline(true); }
};
$('cAdd').onclick = async () => {
  const n = $('cName').value.trim(), g = parseFloat($('cGrams').value);
  if (!n || !g) return;
  await sumar(n, g); $('cName').value = ''; $('cGrams').value = '';
};
$('cGrams').addEventListener('keydown', e => { if (e.key === 'Enter') $('cAdd').click(); });
$('goalInput').addEventListener('change', async () => {
  const v = parseInt($('goalInput').value);
  if (v > 0) { goals[who] = v; pintarEscala(); pintarSemana(); await guardarObjetivo(who, v); }
});

(async () => {
  const fechaTxt = new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})
    .replace(/^\w/, c => c.toUpperCase());
  $('foot').textContent = SOLO ? `${fechaTxt} · Portal de ${who}` : `${fechaTxt} · Los dos ven los mismos datos.`;
  pintarQuien(); pintarCats(); pintarFoods();
  await cargarObjetivos();
  $('goalInput').value = goals[who];
  await cargarDia(); await cargarSemana(); pintarTodo();
})();
</script>
</body>
</html>
